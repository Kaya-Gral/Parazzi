<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d9488">
  <title>Parazzi — Offline</title>
  <style>
    :root { --p: #0d9488; --bg: #f1f5f9; --text: #0f172a; --muted: #64748b; --card: #fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; }
    .box { text-align: center; padding: 40px 24px; max-width: 360px; }
    .icon { width: 72px; height: 72px; border-radius: 22px; background: linear-gradient(135deg, var(--p) 0%, #0f766e 100%); color: #fff; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px; box-shadow: 0 4px 14px rgba(13,148,136,0.3); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 15px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; }
    .btn { display: inline-block; padding: 12px 24px; border-radius: 12px; background: var(--p); color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M12 7v10" stroke-linecap="round"/><path d="M7 12h10" stroke-linecap="round"/></svg>
    </div>
    <h1>You are offline</h1>
    <p>Parazzi needs an internet connection to sync with your pharmacy center. Your local data is safe and you can continue using the app once you're back online.</p>
    <button class="btn" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
