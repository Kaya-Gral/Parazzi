name: Build TWA

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init TWA project
        run: |
          mkdir -p twa
          bubblewrap init --manifest https://parazzi.vercel.app --directory ./twa --skip-prompts

      - name: Build APK and AAB
        run: cd twa && bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parazzi-apk
          path: twa/app-release-signed.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parazzi-aab
          path: twa/app-release-bundle.aab
