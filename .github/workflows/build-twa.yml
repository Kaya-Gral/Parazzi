name: Build TWA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap and expect
        run: |
          npm install -g @bubblewrap/cli
          sudo apt-get update -qq && sudo apt-get install -y -qq expect

      - name: Init TWA project (auto-answer all prompts)
        run: |
          mkdir -p twa
          expect -c '
            set timeout 60
            spawn npx @bubblewrap/cli init --manifest https://parazzi.vercel.app/manifest.json --directory ./twa
            expect {
              -re ".*" { send "\r"; exp_continue }
              eof
            }
          '

      - name: Generate signing keystore
        run: |
          cd twa
          keytool -genkey \
            -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Parazzi"

      - name: Build APK and AAB
        run: |
          cd twa
          expect -c '
            set timeout 300
            spawn npx @bubblewrap/cli build
            expect {
              -re ".*" { send "\r"; exp_continue }
              eof
            }
          '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parazzi-apk
          path: twa/app-release-signed.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: parazzi-aab
          path: twa/app-release-bundle.aab
